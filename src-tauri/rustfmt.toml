# Deterministic formatting so `cargo fmt --all -- --check` in CI is stable
# across machines. Only stable rustfmt options are used (no nightly-gated
# keys), so the CI fmt gate runs on the stable toolchain.
edition = "2021"
max_width = 100
tab_spaces = 4
hard_tabs = false
newline_style = "Unix"
use_small_heuristics = "Default"
